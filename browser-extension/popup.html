<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZapTask Quick Capture</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <header>
      <strong>ZapTask</strong>
      <a href="options.html" target="_blank" rel="noreferrer">Options</a>
    </header>

    <form id="task-form">
      <label>
        Title
        <input id="title" type="text" maxlength="255" required placeholder="What needs doing?" />
      </label>

      <label>
        Project
        <select id="project" required></select>
      </label>

      <label>
        Priority
        <select id="priority">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
          <option value="Critical">Critical</option>
        </select>
      </label>

      <label class="checkbox">
        <input id="include-page" type="checkbox" checked />
        Include current page URL in description
      </label>

      <button type="submit" id="submit">Create task</button>
    </form>

    <p id="status" class="status" role="status"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
